name: Keep Streamlit Dashboard Awake

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

jobs:
  wake-streamlit:
    name: Wake Streamlit apps
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      STREAMLIT_APP_URLS: ${{ vars.STREAMLIT_APP_URLS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install wake dependencies
        run: python -m pip install -r requirements-wake.txt

      - name: Wake Streamlit dashboards
        run: python scripts/wake_streamlit_app.py
